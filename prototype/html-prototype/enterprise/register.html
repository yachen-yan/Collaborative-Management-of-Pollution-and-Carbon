<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企业注册 — 污碳协同AI监管平台</title>
  <script src="../js/data.js"></script>
  <script src="../js/common.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif; background:#020617; color:#e2e8f0; min-height:100vh; overflow-x:hidden; }
    .reg-bg { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; position:relative; }
    .reg-grid { position:absolute; top:0; left:0; right:0; bottom:0; background-image:linear-gradient(rgba(34,211,238,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,0.03) 1px,transparent 1px); background-size:50px 50px; }
    .reg-particles { position:absolute; top:0; left:0; right:0; bottom:0; }
    .lp { position:absolute; width:2px; height:2px; border-radius:50%; background:#22d3ee; box-shadow:0 0 6px #22d3ee; animation:lpFloat 8s ease-in-out infinite; }
    @keyframes lpFloat { 0%,100%{opacity:0;transform:translateY(0)} 20%{opacity:0.6} 80%{opacity:0.6} 100%{transform:translateY(-300px);opacity:0} }
    .reg-box { position:relative; z-index:1; width:520px; background:rgba(34,211,238,0.04); backdrop-filter:blur(20px); border:1px solid rgba(34,211,238,0.15); border-radius:16px; padding:40px; box-shadow:0 20px 60px rgba(0,0,0,0.4),0 0 40px rgba(34,211,238,0.05); }
    .reg-box::before { content:""; position:absolute; top:0; left:20%; right:20%; height:2px; background:linear-gradient(90deg,transparent,#22d3ee,transparent); }
    .reg-logo { text-align:center; margin-bottom:24px; }
    .reg-logo-icon { width:56px; height:56px; border-radius:14px; background:linear-gradient(135deg,rgba(14,165,233,0.8),rgba(34,211,238,0.6)); display:inline-flex; align-items:center; justify-content:center; font-size:28px; margin-bottom:12px; box-shadow:0 0 30px rgba(14,165,233,0.3); }
    .reg-logo-title { font-size:20px; font-weight:600; color:#e2e8f0; }
    .reg-logo-sub { font-size:13px; color:rgba(226,232,240,0.4); margin-top:6px; }
    .reg-steps { display:flex; align-items:center; margin-bottom:28px; }
    .reg-step { display:flex; align-items:center; gap:8px; flex:1; }
    .reg-step-circle { width:28px; height:28px; border-radius:50%; border:2px solid rgba(34,211,238,0.2); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:rgba(226,232,240,0.35); background:transparent; }
    .reg-step.active .reg-step-circle { border-color:#22d3ee; color:#22d3ee; background:rgba(34,211,238,0.1); box-shadow:0 0 10px rgba(34,211,238,0.2); }
    .reg-step.done .reg-step-circle { border-color:#4ade80; color:#020617; background:#4ade80; }
    .reg-step-text { font-size:13px; color:rgba(226,232,240,0.35); }
    .reg-step.active .reg-step-text { color:rgba(226,232,240,0.85); font-weight:500; }
    .reg-step-line { width:30px; height:2px; background:rgba(34,211,238,0.1); margin:0 8px; }
    .reg-step-line.done { background:#4ade80; }
    .reg-content { display:none; }
    .reg-content.active { display:block; animation:fadeIn 0.3s ease; }
    .reg-form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .reg-form-item { margin-bottom:14px; }
    .reg-form-item.full { grid-column:span 2; }
    .reg-form-item label { display:block; margin-bottom:5px; font-size:13px; color:rgba(226,232,240,0.6); }
    .reg-form-item label .required { color:#f87171; margin-left:2px; }
    .reg-form-item input, .reg-form-item select { width:100%; padding:9px 12px; border:1px solid rgba(34,211,238,0.15); border-radius:6px; font-size:14px; outline:none; background:rgba(34,211,238,0.04); color:#e2e8f0; transition:all 0.2s; }
    .reg-form-item input::placeholder { color:rgba(226,232,240,0.25); }
    .reg-form-item input:focus, .reg-form-item select:focus { border-color:#22d3ee; box-shadow:0 0 12px rgba(34,211,238,0.15); background:rgba(34,211,238,0.08); }
    .reg-code-row { display:flex; gap:10px; }
    .reg-code-row input { flex:1; }
    .reg-code-btn { padding:9px 14px; background:linear-gradient(135deg,#0ea5e9,#22d3ee); color:#020617; border:none; border-radius:6px; font-size:13px; cursor:pointer; white-space:nowrap; font-weight:600; box-shadow:0 0 15px rgba(14,165,233,0.3); transition:all 0.2s; }
    .reg-code-btn:hover { box-shadow:0 0 20px rgba(14,165,233,0.5); transform:translateY(-1px); }
    .reg-upload { border:2px dashed rgba(34,211,238,0.2); border-radius:8px; padding:24px; text-align:center; background:rgba(34,211,238,0.03); cursor:pointer; transition:all 0.2s; }
    .reg-upload:hover { border-color:#22d3ee; background:rgba(34,211,238,0.06); }
    .reg-upload-icon { font-size:32px; margin-bottom:8px; }
    .reg-upload-text { font-size:13px; color:rgba(226,232,240,0.4); }
    .reg-nav { display:flex; justify-content:space-between; margin-top:24px; padding-top:20px; border-top:1px solid rgba(34,211,238,0.1); }
    .btn-tech { padding:10px 24px; border-radius:8px; font-size:14px; cursor:pointer; border:none; transition:all 0.2s; font-weight:500; }
    .btn-tech-primary { background:linear-gradient(135deg,#0ea5e9,#22d3ee); color:#020617; box-shadow:0 0 15px rgba(14,165,233,0.3); }
    .btn-tech-primary:hover { box-shadow:0 0 25px rgba(14,165,233,0.5); transform:translateY(-2px); }
    .btn-tech-default { background:rgba(34,211,238,0.08); color:#22d3ee; border:1px solid rgba(34,211,238,0.2); }
    .btn-tech-default:hover { background:rgba(34,211,238,0.15); }
    .reg-success { text-align:center; padding:40px 20px; }
    .reg-success-icon { font-size:64px; margin-bottom:16px; }
    .reg-success-title { font-size:20px; font-weight:600; margin-bottom:8px; color:#e2e8f0; }
    .reg-success-desc { font-size:14px; color:rgba(226,232,240,0.4); line-height:1.8; margin-bottom:24px; }
    .reg-progress { background:rgba(34,197,94,0.06); border:1px solid rgba(34,197,94,0.15); border-radius:8px; padding:14px 20px; margin-bottom:24px; text-align:left; font-size:13px; line-height:2; color:rgba(226,232,240,0.6); }
    .reg-progress strong { color:#4ade80; }
  </style>
  <link rel="stylesheet" href="../css/style.css">

</head>
<body>
  <div class="page-loader" id="pageLoader"><div class="loader-ring"></div><div class="loader-text">INITIALIZING SYSTEM</div></div>
  <div class="reg-bg">
    <div class="reg-grid"></div>
    <div class="reg-particles">
      <div class="lp" style="left:15%;bottom:15%;animation-delay:0s"></div>
      <div class="lp" style="left:30%;bottom:25%;animation-delay:2s"></div>
      <div class="lp" style="left:50%;bottom:10%;animation-delay:4s"></div>
      <div class="lp" style="left:70%;bottom:30%;animation-delay:1s"></div>
      <div class="lp" style="left:85%;bottom:20%;animation-delay:3s"></div>
    </div>
    <div class="reg-box">
      <div class="reg-logo">
        <div class="reg-logo-icon">🌿</div>
        <div class="reg-logo-title">企业注册</div>
        <div class="reg-logo-sub">加入污碳协同AI监管平台，开启智能环保管理</div>
      </div>
      <div class="reg-steps">
        <div class="reg-step active" id="step1Item"><div class="reg-step-circle" id="step1Circle">1</div><span class="reg-step-text">企业信息</span></div>
        <div class="reg-step-line" id="line1"></div>
        <div class="reg-step" id="step2Item"><div class="reg-step-circle" id="step2Circle">2</div><span class="reg-step-text">实名认证</span></div>
        <div class="reg-step-line" id="line2"></div>
        <div class="reg-step" id="step3Item"><div class="reg-step-circle" id="step3Circle">3</div><span class="reg-step-text">完成</span></div>
      </div>
      <div class="reg-content active" id="regStep1">
        <div class="reg-form-grid">
          <div class="reg-form-item"><label>企业名称<span class="required">*</span></label><input type="text" placeholder="请输入企业全称" value="蓝天工业涂装有限公司"></div>
          <div class="reg-form-item"><label>统一社会信用代码<span class="required">*</span></label><input type="text" placeholder="18位统一社会信用代码" value="91110108MA0012345"></div>
          <div class="reg-form-item full"><label>注册地址<span class="required">*</span></label><input type="text" placeholder="请输入企业注册地址" value="北京市怀柔区张镇工业园A区3号"></div>
          <div class="reg-form-item"><label>所属行业<span class="required">*</span></label><select style="color:#e2e8f0"><option>工业涂装</option><option selected>汽车零部件涂装</option><option>家具涂装</option><option>金属涂装</option><option>汽修行业</option></select></div>
          <div class="reg-form-item"><label>排污许可证编号</label><input type="text" placeholder="请输入许可证编号" value="91110108MA0012345001P"></div>
          <div class="reg-form-item"><label>联系人姓名<span class="required">*</span></label><input type="text" placeholder="请输入联系人姓名" value="张环保"></div>
          <div class="reg-form-item"><label>联系人手机号<span class="required">*</span></label><input type="text" placeholder="请输入手机号" value="138****5678"></div>
          <div class="reg-form-item full"><label>设置登录密码<span class="required">*</span></label><input type="password" placeholder="8-20位，含字母和数字" value="demo1234"></div>
        </div>
        <div class="reg-nav"><span></span><button class="btn-tech btn-tech-primary" onclick="goRegStep(2)">下一步：实名认证 →</button></div>
      </div>
      <div class="reg-content" id="regStep2">
        <div class="reg-form-item full"><label>营业执照上传<span class="required">*</span></label><div class="reg-upload" onclick="this.innerHTML='<div style=font-size:32px>✅</div><div style=font-size:13px;margin-top:8px>营业执照_蓝天工业.jpg<br><span style=color:#4ade80>上传成功</span></div>'"><div class="reg-upload-icon">📎</div><div class="reg-upload-text">点击上传营业执照扫描件<br>支持 JPG / PNG / PDF</div></div></div>
        <div class="reg-form-item full"><label>法人身份证上传<span class="required">*</span></label><div class="reg-upload" onclick="this.innerHTML='<div style=font-size:32px>✅</div><div style=font-size:13px;margin-top:8px>身份证_张三.jpg<br><span style=color:#4ade80>上传成功</span></div>'"><div class="reg-upload-icon">🪪</div><div class="reg-upload-text">点击上传法人身份证正反面<br>支持 JPG / PNG</div></div></div>
        <div class="reg-form-item full"><label>短信验证码<span class="required">*</span></label><div class="reg-code-row"><input type="text" placeholder="请输入验证码"><button class="reg-code-btn">获取验证码</button></div></div>
        <div class="reg-form-item full"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" checked> 我已阅读并同意 <a href="#" style="color:#22d3ee">用户协议</a> 和 <a href="#" style="color:#22d3ee">隐私政策</a></label></div>
        <div class="reg-nav"><button class="btn-tech btn-tech-default" onclick="goRegStep(1)">← 上一步</button><button class="btn-tech btn-tech-primary" onclick="goRegStep(3)">提交注册</button></div>
      </div>
      <div class="reg-content" id="regStep3">
        <div class="reg-success">
          <div class="reg-success-icon">🎉</div>
          <div class="reg-success-title">注册提交成功</div>
          <div class="reg-success-desc">您的企业信息已提交审核<br>监测数据科将在 <strong style="color:#22d3ee">1-2 个工作日</strong> 内完成审核<br>审核结果将通过短信通知您</div>
          <div class="reg-progress"><strong>📋 审核进度</strong><br>✅ 企业信息填写完成<br>✅ 实名认证材料上传完成<br>⏳ 等待监测数据科审核<br>⬜ 审核通过，开通平台权限</div>
          <a href="login.html" class="btn-tech btn-tech-primary" style="display:inline-block;text-decoration:none;padding:10px 40px">前往登录页</a>
        </div>
      </div>
    </div>
  </div>
  <script>
    function goRegStep(n) {
      document.querySelectorAll('.reg-content').forEach(el=>el.classList.remove('active'));
      document.getElementById('regStep'+n).classList.add('active');
      for(let i=1;i<=3;i++){
        const item=document.getElementById('step'+i+'Item');
        const circle=document.getElementById('step'+i+'Circle');
        const line=document.getElementById('line'+(i-1));
        item.classList.remove('active','done');
        if(i<n){item.classList.add('done');circle.textContent='✓';if(line)line.classList.add('done');}
        else if(i===n){item.classList.add('active');circle.textContent=i;}
        else{circle.textContent=i;}
        if(i>=n&&line)line.classList.remove('done');
      }
      // 注册成功：保存企业信息到 DataStore
      if (n === 3) {
        try {
          const entName = document.querySelector('input[placeholder="请输入企业全称"]').value || '蓝天工业涂装有限公司';
          const entIndustry = document.querySelector('select').value || '汽车零部件涂装';
          DataStore.set('enterprise', {
            name: entName,
            industry: entIndustry,
            code: document.querySelector('input[placeholder="18位统一社会信用代码"]').value || '91110108MA0012345',
            address: document.querySelector('input[placeholder="请输入企业注册地址"]').value || '北京市怀柔区张镇工业园A区3号',
            permit: document.querySelector('input[placeholder="请输入许可证编号"]').value || '91110108MA0012345001P',
            contact: document.querySelector('input[placeholder="请输入联系人姓名"]').value || '张环保',
            phone: document.querySelector('input[placeholder="请输入手机号"]').value || '138****5678'
          });
          DataStore.set('registeredAt', new Date().toISOString());
        } catch(e) { /* DataStore save skipped silently */ }
        setTimeout(function() { showToast('⏳ 3秒后自动跳转至登录页...', 'info'); }, 800);
        setTimeout(function() { window.location.href = 'login.html'; }, 3500);
      }
    }
  </script>
</body>
</html>
