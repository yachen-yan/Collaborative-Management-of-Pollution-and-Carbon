<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>企业登录 — 污碳协同AI监管平台</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: "PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
      background: #020617; color: #e2e8f0; min-height:100vh; overflow:hidden;
    }
    .login-bg {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background: radial-gradient(ellipse at 20% 50%, rgba(14,165,233,0.15) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 20%, rgba(34,211,238,0.1) 0%, transparent 40%),
                  #020617;
    }
    .login-grid {
      position:absolute; top:0; left:0; right:0; bottom:0;
      background-image: linear-gradient(rgba(34,211,238,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,211,238,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    .login-particles {
      position:absolute; top:0; left:0; right:0; bottom:0;
    }
    .lp { position:absolute; width:2px; height:2px; border-radius:50%; background:#22d3ee; box-shadow:0 0 6px #22d3ee; animation:lpFloat 8s ease-in-out infinite; }
    @keyframes lpFloat { 0%,100%{opacity:0;transform:translateY(0)} 20%{opacity:0.6} 80%{opacity:0.6} 100%{transform:translateY(-300px);opacity:0} }
    .login-box {
      position: relative; z-index: 1;
      width: 440px; margin: 80px auto;
      background: rgba(34,211,238,0.04); backdrop-filter:blur(20px);
      border: 1px solid rgba(34,211,238,0.15); border-radius: 16px;
      padding: 48px 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 40px rgba(34,211,238,0.05);
    }
    .login-box::before {
      content:""; position:absolute; top:0; left:20%; right:20%; height:2px;
      background: linear-gradient(90deg, transparent, #22d3ee, transparent);
    }
    .login-logo { text-align: center; margin-bottom: 8px; }
    .login-logo-icon {
      width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, rgba(14,165,233,0.8), rgba(34,211,238,0.6));
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 32px; margin-bottom: 16px; box-shadow:0 0 30px rgba(14,165,233,0.3);
    }
    .login-logo-title { font-size: 22px; font-weight: 600; color:#e2e8f0; }
    .login-logo-sub { font-size: 13px; color: rgba(226,232,240,0.4); margin-top: 6px; }
    .login-tabs {
      display: flex; margin: 28px 0 20px; border-bottom: 1px solid rgba(34,211,238,0.1);
    }
    .login-tab {
      flex: 1; text-align: center; padding: 10px;
      font-size: 15px; color: rgba(226,232,240,0.35); cursor: pointer;
      position: relative; transition: color 0.2s;
    }
    .login-tab.active { color: #22d3ee; font-weight: 500; }
    .login-tab.active::after {
      content: ""; position: absolute; bottom: -1px; left: 20%; right: 20%;
      height: 2px; background: linear-gradient(90deg,transparent,#22d3ee,transparent); border-radius: 2px;
      box-shadow:0 0 8px #22d3ee;
    }
    .login-input-wrap { position: relative; margin-bottom: 18px; }
    .login-input-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: rgba(34,211,238,0.4); font-size: 16px;
    }
    .login-input {
      width: 100%; padding: 11px 12px 11px 40px;
      border: 1px solid rgba(34,211,238,0.15); border-radius: 8px;
      font-size: 14px; outline: none; background: rgba(34,211,238,0.04);
      color: #e2e8f0; transition: all 0.2s;
    }
    .login-input::placeholder { color: rgba(226,232,240,0.25); }
    .login-input:focus { border-color: #22d3ee; box-shadow: 0 0 12px rgba(34,211,238,0.15); background: rgba(34,211,238,0.08); }
    .login-code-row { display: flex; gap: 12px; }
    .login-code-row .login-input-wrap { flex: 1; }
    .login-code-btn {
      padding: 11px 16px; background: linear-gradient(135deg, #0ea5e9, #22d3ee);
      color: #020617; border: none; border-radius: 8px; font-size: 13px;
      cursor: pointer; white-space: nowrap; font-weight: 600;
      box-shadow: 0 0 15px rgba(14,165,233,0.3); transition:all 0.2s;
    }
    .login-code-btn:hover { box-shadow: 0 0 20px rgba(14,165,233,0.5); transform:translateY(-1px); }
    .login-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 13px; }
    .login-remember { display: flex; align-items: center; gap: 6px; color: rgba(226,232,240,0.4); cursor: pointer; }
    .login-forgot { color: #22d3ee; cursor: pointer; }
    .login-forgot:hover { text-shadow:0 0 8px rgba(34,211,238,0.5); }
    .login-submit {
      width: 100%; padding: 12px;
      background: linear-gradient(135deg, #0ea5e9, #22d3ee);
      color: #020617; border: none; border-radius: 8px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      box-shadow: 0 0 20px rgba(14,165,233,0.3); transition:all 0.2s;
    }
    .login-submit:hover { box-shadow: 0 0 30px rgba(14,165,233,0.5); transform:translateY(-2px); }
    .login-footer { text-align: center; margin-top: 24px; font-size: 12px; color: rgba(226,232,240,0.25); line-height: 1.8; }
    .login-footer a { color: #22d3ee; }
    .login-demo-accounts {
      margin-top: 20px; padding: 14px;
      background: rgba(34,197,94,0.06); border: 1px solid rgba(34,197,94,0.15);
      border-radius: 8px; font-size: 12px;
    }
    .login-demo-accounts-title { font-weight: 600; color: #4ade80; margin-bottom: 6px; }
    .login-demo-account { color: rgba(226,232,240,0.6); cursor: pointer; padding: 2px 0; transition:all 0.2s; }
    .login-demo-account:hover { color: #22d3ee; }
    .login-demo-account span { color: #22d3ee; font-weight: 500; }
  </style>
</head>
<body>
  <div class="login-bg">
    <div class="login-grid"></div>
    <div class="login-particles">
      <div class="lp" style="left:10%;bottom:10%;animation-delay:0s"></div>
      <div class="lp" style="left:25%;bottom:20%;animation-delay:2s"></div>
      <div class="lp" style="left:40%;bottom:15%;animation-delay:4s"></div>
      <div class="lp" style="left:60%;bottom:25%;animation-delay:1s"></div>
      <div class="lp" style="left:75%;bottom:10%;animation-delay:3s"></div>
      <div class="lp" style="left:90%;bottom:30%;animation-delay:5s"></div>
    </div>
  </div>
  
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">🌿</div>
      <div class="login-logo-title">污碳协同 AI 监管平台</div>
      <div class="login-logo-sub">工业涂装行业 VOCs 与碳排放协同监测预警</div>
    </div>
    
    <div class="login-tabs">
      <div class="login-tab active" onclick="switchTab(this, 'pwd')">账号密码登录</div>
      <div class="login-tab" onclick="switchTab(this, 'sms')">短信验证码登录</div>
    </div>
    
    <div id="login-pwd">
      <div class="login-input-wrap">
        <span class="login-input-icon">👤</span>
        <input class="login-input" placeholder="请输入统一社会信用代码 / 手机号" value="91110108MA0012345">
      </div>
      <div class="login-input-wrap">
        <span class="login-input-icon">🔒</span>
        <input class="login-input" type="password" placeholder="请输入密码" value="demo1234">
      </div>
      <div class="login-options">
        <label class="login-remember"><input type="checkbox" checked> 记住我</label>
        <span class="login-forgot">忘记密码？</span>
      </div>
      <button class="login-submit" onclick="doLogin()">登 录</button>
    </div>
    
    <div id="login-sms" style="display:none">
      <div class="login-input-wrap">
        <span class="login-input-icon">📱</span>
        <input class="login-input" placeholder="请输入手机号" value="138****5678">
      </div>
      <div class="login-code-row">
        <div class="login-input-wrap">
          <span class="login-input-icon">🔢</span>
          <input class="login-input" placeholder="请输入验证码">
        </div>
        <button class="login-code-btn">获取验证码</button>
      </div>
      <div class="login-options" style="margin-top:18px">
        <label class="login-remember"><input type="checkbox" checked> 记住我</label>
      </div>
      <button class="login-submit" onclick="doLogin()">登 录</button>
    </div>
    
    <div class="login-demo-accounts">
      <div class="login-demo-accounts-title">🎯 原型演示快速入口</div>
      <div class="login-demo-account" onclick="doLogin()">🏭 <span>企业端</span> — 蓝天工业涂装有限公司</div>
      <div class="login-demo-account" style="margin-top:4px">🏛️ <span>管理科</span> — 协同管控指挥大屏</div>
      <div class="login-demo-account" style="margin-top:4px">🗺️ <span>监测科</span> — 3D GIS 监测台</div>
    </div>
    
    <div class="login-footer">
      登录即表示同意 <a href="#">用户协议</a> 和 <a href="#">隐私政策</a><br>
      © 2026 污碳协同AI监管平台 · 技术支持：生态环境局
    </div>
  </div>
  
  <script>
    function switchTab(el, type) {
      document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('login-pwd').style.display = type === 'pwd' ? 'block' : 'none';
      document.getElementById('login-sms').style.display = type === 'sms' ? 'block' : 'none';
    }
    function doLogin() { window.location.href = 'dashboard.html'; }
  </script>
</body>
</html>
