<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>三评合一报告 — 污碳协同AI监管平台</title>

  <script src="../js/data.js"></script>
  <style>
    .topbar { background: linear-gradient(90deg, rgba(12,74,110,0.9), rgba(3,105,161,0.9)); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(34,211,238,0.15); }
    .main { margin-left: 200px; margin-top: 64px; padding: 24px; }
    .page-header { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .page-sub { font-size: 13px; color: rgba(226,232,240,0.4); margin-bottom: 20px; }
    
    .report-header {
      background: linear-gradient(135deg, #1677ff 0%, #36cfc9 100%);
      color: #fff; padding: 28px; border-radius: 8px; margin-bottom: 20px;
    }
    .report-header-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .report-header-info { font-size: 13px; opacity: 0.9; }
    .report-header-badge {
      display: inline-block; margin-top: 12px; padding: 4px 14px;
      background: rgba(255,255,255,0.2); border-radius: 12px; font-size: 13px;
    }
    
    .score-overview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
    .score-box { text-align: center; padding: 20px; }
    .score-box-ring {
      width: 90px; height: 90px; margin: 0 auto 10px; position: relative;
    }
    .score-box-ring svg { transform: rotate(-90deg); }
    .score-box-value {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      font-size: 22px; font-weight: 700;
    }
    .score-box-label { font-size: 13px; color: rgba(226,232,240,0.4); margin-top: 4px; }
    .score-box-grade { font-size: 12px; margin-top: 4px; font-weight: 500; }
    
    .ai-summary {
      background: #f6ffed; border: 1px solid #b7eb8f; border-radius: 8px;
      padding: 16px 20px; margin-bottom: 20px;
    }
    .ai-summary-title { font-weight: 600; color: #52c41a; margin-bottom: 8px; }
    .ai-summary-text { font-size: 14px; line-height: 1.8; color: rgba(0,0,0,0.75); }
    .ai-summary-text strong { color: #f5222d; }
    
    .detail-section { margin-bottom: 20px; }
    .detail-section-title {
      font-size: 15px; font-weight: 600; margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .detail-item {
      padding: 14px; border-radius: 6px; background: rgba(34,211,238,0.04);
    }
    .detail-item-name { font-size: 12px; color: rgba(226,232,240,0.4); margin-bottom: 4px; }
    .detail-item-value { font-size: 18px; font-weight: 600; }
    .detail-item-desc { font-size: 11px; color: rgba(226,232,240,0.3); margin-top: 2px; }
    
    .priority-list { margin-top: 8px; }
    .priority-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      border-radius: 6px; margin-bottom: 8px; background: rgba(34,211,238,0.04);
    }
    .priority-rank {
      width: 24px; height: 24px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 12px;
      font-weight: 600; color: #fff; flex-shrink: 0;
    }
    .priority-rank.p1 { background: #f5222d; }
    .priority-rank.p2 { background: #fa8c16; }
    .priority-rank.p3 { background: #faad14; }
    .priority-text { flex: 1; font-size: 13px; }
    .priority-score { font-size: 12px; color: rgba(226,232,240,0.4); }
    
    .report-actions {
      display: flex; gap: 12px; justify-content: center; margin-top: 24px; padding-top: 20px;
      border-top: 1px solid #f0f0f0;
    }
  </style>
  <link rel="stylesheet" href="../css/style.css">

</head>
<body>
  <div class="bg-honeycomb"></div>
  <div class="page-loader" id="pageLoader"><div class="loader-ring"></div><div class="loader-text">INITIALIZING SYSTEM</div></div>
  <div class="topbar">
    <div class="logo">🌿 污碳协同AI监管平台</div>
    <div class="user"><span>蓝天工业涂装有限公司</span><div class="avatar">张</div><span>张环保</span></div>
  </div>
  <div class="sidebar">
    <a href="dashboard.html" class="sidebar-item"><span class="sidebar-icon">🏠</span>工作台</a>
    <a href="monthly-report.html" class="sidebar-item"><span class="sidebar-icon">📋</span>月度数据填报</a>
    <a href="realtime-panel.html" class="sidebar-item"><span class="sidebar-icon">📊</span>实时双算看板</a>
    <a href="simulator.html" class="sidebar-item"><span class="sidebar-icon">🔮</span>悖论模拟器</a>
    <a href="triple-report.html" class="sidebar-item active"><span class="sidebar-icon">📑</span>三评合一报告</a>
    <a href="alerts.html" class="sidebar-item"><span class="sidebar-icon">🔔</span>预警中心</a>
  </div>
  
  <div class="main">
    <div class="page-header">📑 三评合一智能报告</div>
    <div class="page-sub" id="reportSub">报告周期：2026年5月 | 生成时间：2026-06-05 08:30 | 类型：自动生成</div>

    <div class="report-header" id="reportHeader">
      <div class="report-header-title" id="reportTitle">🏭 蓝天工业涂装有限公司 — 污-能-碳三评合一报告</div>
      <div class="report-header-info" id="reportInfo">
        统一社会信用代码：91110108MA0012345 | 行业：汽车零部件涂装<br>
        报告周期：2026年5月1日 — 2026年5月31日
      </div>
      <div class="report-header-badge">📋 三评合一 | 🏷️ 工业涂装 MVP 专版</div>
    </div>

    <!-- 四大评分 -->
    <div class="score-overview" id="scoreOverview"></div>

    <!-- AI 摘要 -->
    <div class="ai-summary" id="aiSummary"></div>

    <!-- 污染评价详情 -->
    <div class="card detail-section" id="pollutionSection"></div>

    <!-- 能效评价详情 -->
    <div class="card detail-section" id="energySection"></div>

    <!-- 碳排评价详情 -->
    <div class="card detail-section" id="carbonSection"></div>

    <!-- 改进优先级 -->
    <div class="card detail-section" id="prioritySection"></div>

    <div class="report-actions">
      <button class="btn btn-default btn-lg" onclick="showToast('历史报告功能开发中...','info')">📊 查看历史报告</button>
      <button class="btn btn-primary btn-lg" onclick="window.print()">📥 导出 PDF 报告</button>
    </div>

    <div style="height:40px"></div>
  </div>
  <script>
    function renderTripleReport() {
      const report = DataStore.getLatestTripleReport();
      if (!report) {
        document.querySelector('.main').innerHTML = '<div style="text-align:center;padding:60px;color:rgba(226,232,240,0.4)">暂无报告数据</div>';
        return;
      }
      const ent = DataStore.get('enterprise', MOCK_DATA.enterprise);
      const health = DataStore.get('healthScore', MOCK_DATA.healthScore);

      // 头部信息
      document.getElementById('reportTitle').textContent = '🏭 ' + ent.name + ' — 污-能-碳三评合一报告';
      document.getElementById('reportInfo').innerHTML = '统一社会信用代码：' + ent.licenseNo + ' | 行业：' + ent.industry + '<br>报告周期：2026年5月1日 — 2026年5月31日';
      document.getElementById('reportSub').textContent = '报告周期：' + report.month.replace('-','年') + '月 | 生成时间：' + report.generatedAt + ' | 类型：' + report.type;

      // 四大评分
      const scores = report.scores || { p: 82, e: 65, c: 58, cp: 0.52 };
      const scoreItems = [
        { key: 'p', label: '污染评价（P）', color: '#52c41a', grade: '良', emoji: '🟢' },
        { key: 'e', label: '能效评价（E）', color: '#faad14', grade: '一般', emoji: '🟡' },
        { key: 'c', label: '碳排评价（C）', color: '#fa8c16', grade: '较差', emoji: '🟠' },
        { key: 'cp', label: 'C-P 协同指数', color: '#f5222d', grade: '差', emoji: '🔴' },
      ];
      const circumference = 239;
      document.getElementById('scoreOverview').innerHTML = scoreItems.map(s => {
        const val = scores[s.key];
        const dash = Math.round((val >= 1 ? val : val * 100) / 100 * circumference);
        return `
          <div class="card score-box" onclick="document.getElementById('${{p:'pollutionSection',e:'energySection',c:'carbonSection',cp:'prioritySection'}[s.key]}').scrollIntoView({behavior:'smooth',block:'center'})" style="cursor:pointer">
            <div class="score-box-ring">
              <svg width="90" height="90"><circle cx="45" cy="45" r="38" fill="none" stroke="#f0f0f0" stroke-width="8"/><circle cx="45" cy="45" r="38" fill="none" stroke="${s.color}" stroke-width="8" stroke-dasharray="${dash} ${circumference}" stroke-linecap="round"/></svg>
              <div class="score-box-value" style="color:${s.color}">${val}</div>
            </div>
            <div class="score-box-label">${s.label}</div>
            <div class="score-box-grade" style="color:${s.color}">${s.emoji} ${s.grade}</div>
          </div>`;
      }).join('');

      // AI 摘要
      document.getElementById('aiSummary').innerHTML = `
        <div class="ai-summary-title">🤖 AI 核心结论</div>
        <div class="ai-summary-text">${report.aiSummary}</div>`;

      // 详情区块渲染
      function renderDetailSection(id, title, icon, items) {
        const container = document.getElementById(id);
        container.innerHTML = `
          <div class="detail-section-title">${icon} ${title}</div>
          <div class="detail-grid">
            ${items.map(item => `
              <div class="detail-item">
                <div class="detail-item-name">${item.name}</div>
                <div class="detail-item-value" style="color:${item.color}">${item.value}</div>
                <div class="detail-item-desc">满分${item.max}分 → ${item.score}分${item.desc ? '（' + item.desc + '）' : ''}</div>
              </div>
            `).join('')}
          </div>`;
      }

      const details = report.details || MOCK_DATA.tripleReports[0].details;
      renderDetailSection('pollutionSection', '污染评价详情（P = ' + scores.p + '分）', '🌫️', details.pollution);
      renderDetailSection('energySection', '能效评价详情（E = ' + scores.e + '分）', '⚡', details.energy);
      renderDetailSection('carbonSection', '碳排评价详情（C = ' + scores.c + '分）', '🌱', details.carbon);

      // 改进优先级
      const priorities = report.priorities || MOCK_DATA.tripleReports[0].priorities;
      document.getElementById('prioritySection').innerHTML = `
        <div class="detail-section-title">🎯 改进优先级建议</div>
        <div class="priority-list">
          ${priorities.map(p => `
            <div class="priority-item" onclick="this.style.opacity='0.5';this.style.textDecoration='line-through';showToast('已标记为处理中','success')" style="cursor:pointer">
              <div class="priority-rank ${p.color}">${p.rank}</div>
              <div class="priority-text">${p.text}</div>
              <div class="priority-score">预期提升 ${p.score}</div>
            </div>
          `).join('')}
        </div>`;
    }

    renderTripleReport();
  </script>
  <script>
  window.addEventListener('load', function() {
    setTimeout(function() {
      var el = document.getElementById('pageLoader');
      if (el) el.classList.add('done');
    }, 500);
  });
</script>
</body>
</html>
